# Quy tắc nghiệp vụ (tách riêng khỏi YAML chứa SQL).
# Operator hỗ trợ cho condition: eq, ne, gt, lt, gte, lte, in, exists.
# Đây là quy tắc demo, chưa được Denso xác nhận.
version: "1.0"
rules:
  - id: R_MACHINE_STOP
    name: "Máy dừng lan truyền tới công đoạn phụ thuộc"
    version: 1
    incident_type: MACHINE_STOP
    propagate_kinds:
      - production_dependency
    departments:
      - MAINTENANCE
      - PLANNING
    actions:
      - department: MAINTENANCE
        text: "Kiểm tra máy và mã lỗi thiết bị."
      - department: PLANNING
        text: "Đánh giá điều chỉnh lịch sản xuất."
    priority: HIGH
    assumptions: "Chưa xét tồn đệm, sản xuất bù và máy thay thế."
    hypotheses:
      - id: H_MACHINE_ERROR
        condition: {signal: has_error_code, op: eq, value: true}
        content: "Sự cố thiết bị: mã lỗi xuất hiện trong cửa sổ thời gian phù hợp."
        evidence: "Phát hiện mã lỗi thiết bị liên quan tới máy trong dữ liệu vận hành."
        check_more: "Xác minh mã lỗi với bộ phận bảo trì."
        priority: HIGH

  - id: R_QUALITY
    name: "QC tăng lỗi trong lot"
    version: 1
    incident_type: QUALITY
    propagate_kinds:
      - production_dependency
    departments:
      - QC
      - WAREHOUSE
    actions:
      - department: QC
        text: "Kiểm tra bổ sung hoặc đề xuất giữ lot chờ đánh giá."
      - department: WAREHOUSE
        text: "Truy xuất vật tư liên quan tới lot."
    priority: HIGH
    assumptions: "Nguyên nhân vật tư chỉ là giả thuyết khi chưa xác minh."
    hypotheses:
      - id: H_MATERIAL_BATCH
        condition: {signal: qc_fail, op: eq, value: true}
        content: "Lot linh kiện chung có thể gây lỗi hàng loạt."
        evidence: "Kết quả QC có lỗi trong lot đang xét."
        check_more: "Truy xuất linh kiện dùng chung trong lot."
        priority: HIGH

  - id: R_MATERIAL_SHORTAGE
    name: "Thiếu vật tư ảnh hưởng kế hoạch"
    version: 1
    incident_type: MATERIAL_SHORTAGE
    propagate_kinds:
      - production_dependency
    departments:
      - WAREHOUSE
      - PLANNING
    actions:
      - department: WAREHOUSE
        text: "Kiểm tra vật tư khả dụng."
      - department: PLANNING
        text: "Đánh giá điều chỉnh lịch sản xuất."
    priority: HIGH
    assumptions: "Ngưỡng thiếu vật tư là giá trị demo được cấu hình."
    hypotheses:
      - id: H_LOW_STOCK
        condition: {signal: low_material, op: eq, value: true}
        content: "Vật tư thấp hơn ngưỡng có thể gây thiếu hụt cho công đoạn/lệnh liên quan."
        evidence: "Mức khả dụng vật tư thấp hơn ngưỡng cấu hình."
        check_more: "Kiểm tra tồn kho và lịch nhập hàng."
        priority: HIGH

  - id: R_DATA_DELAY
    name: "Dataset chậm cập nhật"
    version: 1
    incident_type: DATA_DELAY
    propagate_kinds: []
    departments:
      - IT_DATA
    actions:
      - department: IT_DATA
        text: "Kiểm tra nguồn dữ liệu hoặc luồng cập nhật."
    priority: MEDIUM
    assumptions: "Chậm dataset là rủi ro thiếu/chậm thông tin, không kết luận máy dừng."
    hypotheses:
      - id: H_DATA_PIPELINE
        condition: {signal: dataset_delay, op: eq, value: true}
        content: "Lỗi thu thập/truyền dữ liệu (không kết luận thiết bị dừng)."
        evidence: "Dataset chưa nhận dữ liệu mới trong khoảng thời gian dự kiến."
        check_more: "Kiểm tra luồng dữ liệu và nguồn gốc."
        priority: MEDIUM

  - id: R_OTHER
    name: "Sự cố khác"
    version: 1
    incident_type: OTHER
    propagate_kinds:
      - production_dependency
    departments: []
    actions: []
    priority: MEDIUM
    assumptions: ""
    hypotheses: []
