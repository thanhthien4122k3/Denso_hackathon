# Quy tắc nghiệp vụ (tách riêng khỏi YAML chứa SQL).
# Operator hỗ trợ cho condition: eq, ne, gt, lt, gte, lte, in, exists.
# Đây là quy tắc demo, chưa được Denso xác nhận.
# Mã bộ phận dùng chung trong seed: PROD, MAINT, QC, PLAN, WH, DATA.
# text_data là mẫu chuỗi dùng khóa từ quantification/context; thiếu khóa thì dùng text.
version: "1.2"
rules:
  - id: R_MACHINE_STOP
    name: "Máy dừng lan truyền tới công đoạn phụ thuộc"
    version: 1
    incident_type: MACHINE_STOP
    propagate_kinds:
      - production_dependency
    departments:
      - MAINT
      - PROD
      - PLAN
    actions:
      - department: MAINT
        text: "Kiểm tra máy và mã lỗi thiết bị theo hướng dẫn được cấu hình."
      - department: PROD
        text: "Xác minh trạng thái máy và hàng đệm liên quan."
      - department: PLAN
        text: "Đánh giá khả năng bù tiến độ nếu thời gian dừng kéo dài."
    priority: HIGH
    assumptions: "Chưa xét tồn đệm, sản xuất bù và máy thay thế."
    hypotheses:
      - id: H_MACHINE_ERROR
        condition: {signal: has_error_code, op: eq, value: true}
        content: "Sự cố thiết bị: mã lỗi xuất hiện trong cửa sổ thời gian phù hợp."
        evidence: "Phát hiện mã lỗi thiết bị liên quan tới máy trong dữ liệu vận hành."
        check_more: "Xác minh mã lỗi với bộ phận bảo trì."
        priority: HIGH

  - id: R_QUALITY
    name: "QC tăng lỗi trong lot"
    version: 2
    incident_type: QUALITY
    propagate_kinds:
      - production_dependency
    departments:
      - QC
      - WH
      - PROD
      - PLAN
    actions:
      - department: QC
        text: "Kiểm tra bổ sung hoặc đề xuất giữ lot chờ đánh giá."
        text_data: "Giữ lô {lot} chờ đánh giá vì tỷ lệ lỗi {defect_rate:g}% vượt ngưỡng {threshold:g}%."
      - department: WH
        text: "Truy xuất vật tư liên quan tới lot."
        text_data: "Truy xuất vật tư {materials} liên quan lô {lot}."
      - department: PROD
        text: "Tạm dừng chuyển lot sang công đoạn sau."
        text_data: "Chưa chuyển lô {lot} sang công đoạn sau đến khi QC kết luận."
      - department: PLAN
        text: "Đánh giá ảnh hưởng lệnh sản xuất."
        text_data: "Đánh giá ảnh hưởng lệnh {order_code}: ~{estimated_defects:g} pcs nguy cơ lỗi, {plan_defect_pct:g}% kế hoạch."
    priority: HIGH
    assumptions: "Nguyên nhân vật tư chỉ là giả thuyết khi chưa xác minh."
    hypotheses:
      - id: H_MATERIAL_BATCH
        condition: {signal: qc_fail, op: eq, value: true}
        content: "Lot linh kiện chung có thể gây lỗi hàng loạt."
        evidence: "Kết quả QC có lỗi trong lot đang xét."
        check_more: "Truy xuất linh kiện dùng chung trong lot."
        priority: HIGH

  - id: R_MATERIAL_SHORTAGE
    name: "Thiếu vật tư ảnh hưởng kế hoạch"
    version: 2
    incident_type: MATERIAL_SHORTAGE
    propagate_kinds:
      - production_dependency
    departments:
      - WH
      - PROD
      - PLAN
    actions:
      - department: WH
        text: "Kiểm tra vật tư khả dụng."
        text_data: "Xác nhận tồn thực tế {material} còn {available_qty:g} pcs, cạn sau ~{minutes:g} phút lúc {stockout_hm} và lịch nhập hàng."
      - department: PROD
        text: "Chuẩn bị phương án dừng/chuyển lô."
        text_data: "Chuẩn bị dừng có kế hoạch hoặc chuyển lô tại {process_code} khi vật tư cạn."
      - department: PLAN
        text: "Đánh giá điều chỉnh lịch sản xuất."
        text_data: "Đánh giá điều chỉnh lịch {process_code} và các công đoạn phía sau."
    priority: HIGH
    assumptions: "Ngưỡng thiếu vật tư là giá trị demo được cấu hình."
    hypotheses:
      - id: H_LOW_STOCK
        condition: {signal: low_material, op: eq, value: true}
        content: "Vật tư thấp hơn ngưỡng có thể gây thiếu hụt cho công đoạn/lệnh liên quan."
        evidence: "Mức khả dụng vật tư thấp hơn ngưỡng cấu hình."
        check_more: "Kiểm tra tồn kho và lịch nhập hàng."
        priority: HIGH

  - id: R_DATA_DELAY
    name: "Dataset chậm cập nhật"
    version: 1
    incident_type: DATA_DELAY
    propagate_kinds: []
    departments:
      - DATA
    actions:
      - department: DATA
        text: "Kiểm tra nguồn dữ liệu hoặc luồng cập nhật."
    priority: MEDIUM
    assumptions: "Chậm dataset là rủi ro thiếu/chậm thông tin, không kết luận máy dừng."
    hypotheses:
      - id: H_DATA_PIPELINE
        condition: {signal: dataset_delay, op: eq, value: true}
        content: "Lỗi thu thập/truyền dữ liệu (không kết luận thiết bị dừng)."
        evidence: "Dataset chưa nhận dữ liệu mới trong khoảng thời gian dự kiến."
        check_more: "Kiểm tra luồng dữ liệu và nguồn gốc."
        priority: MEDIUM

  - id: R_OTHER
    name: "Sự cố khác"
    version: 1
    incident_type: OTHER
    propagate_kinds:
      - production_dependency
    departments: []
    actions: []
    priority: MEDIUM
    assumptions: ""
    hypotheses: []
