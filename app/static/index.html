<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denso D3 — Liên kết sản xuất & phân tích sự cố</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <button id="nav-toggle" class="icon-btn header-toggle" aria-label="Mở menu" aria-expanded="false">☰</button>
      <button id="collapse-toggle" class="icon-btn header-toggle collapse-toggle" aria-label="Thu gọn menu" title="Thu gọn">‹</button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Denso D3</span>
      </div>
    </div>
    <div class="header-center">
      <h1 id="page-title" class="page-title">Trung tâm vận hành</h1>
    </div>
    <div class="header-right">
      <div class="mode-toggle" role="group" aria-label="Chế độ dữ liệu">
        <button id="mode-operations" class="mode-btn active" data-mode="operations">Vận hành</button>
        <button id="mode-simulation" class="mode-btn" data-mode="simulation">Mô phỏng</button>
      </div>
      <button id="header-record" class="btn btn-primary header-action">+ Ghi nhận</button>
      <button id="header-incident" class="btn btn-outline header-action">Báo cáo sự cố</button>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Điều hướng chính">
      <div class="sidebar-scroll">
        <div id="sidebar-groups"></div>
      </div>
    </nav>

    <main class="content">
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal-close" aria-label="Đóng">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
